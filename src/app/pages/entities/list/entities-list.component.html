<div class="entities-container">

  <div class="header-card">

    <div class="header-info">
      <div class="icon-circle">
        🏢
      </div>

      <div>
        <h1>Entidades</h1>

        <p>
          Gestiona las entidades territoriales registradas en el sistema.
        </p>
      </div>
    </div>

    <a
      routerLink="/entities/create"
      class="create-btn">

      + Nueva Entidad

    </a>

  </div>

  <div class="table-card">

    <app-dynamic-table
      [data]="entities"
      [columns]="columns"
      [actions]="actions"
      [loading]="loading"
      [page]="page"
      [pageSize]="pageSize"
      [totalItems]="total"
      [totalPages]="totalPages"
      (pageChange)="onPageChange($event)"
      (action)="onTableAction($event)">
    </app-dynamic-table>

  </div>

</div>
