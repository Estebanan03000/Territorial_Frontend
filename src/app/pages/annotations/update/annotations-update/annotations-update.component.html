<div class="card">

  <div class="card-body">

    <h2 class="text-xl font-bold mb-4">

      Editar anotación

    </h2>

    @if(annotation){

      <app-annotation-form
        [annotation]="annotation"
        [existingImage]="savedImage"
        [neighborhoods]="neighborhoods"
        (formSubmit)="onUpdate($event)"
        (cancel)="onCancel()"
        (imageSelected)="onImageSelected($event)">
      </app-annotation-form>

    }

  </div>

</div>
