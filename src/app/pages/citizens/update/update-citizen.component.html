<div class="p-6">
  <div class="mb-6">
    <h1 class="text-2xl font-bold">Actualizar ciudadano</h1>
    <p class="text-gray-600">
      Modifica los datos básicos y la ubicación del ciudadano.
    </p>
  </div>

  @if (citizen) {
    <app-citizen-form
      [citizen]="citizen"
      buttonText="Actualizar ciudadano"
      [loading]="loading"
      (formSubmit)="onUpdate($event)"
      (cancel)="onCancel()">
    </app-citizen-form>
  } @else {
    <p>Cargando ciudadano...</p>
  }
</div>
