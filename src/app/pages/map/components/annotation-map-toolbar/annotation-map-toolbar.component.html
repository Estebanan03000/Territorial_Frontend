<div class="toolbar">
  <mat-form-field appearance="outline">
    <mat-label>Comuna</mat-label>
    <mat-select formControlName="id_commune" [formGroup]="form" (selectionChange)="changeCommune()">
      <mat-option value="">Todas</mat-option>
      <mat-option *ngFor="let commune of communes" [value]="commune.id_commune">
        {{ commune.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Barrio</mat-label>
    <mat-select formControlName="id_neighborhood" [formGroup]="form">
      <mat-option value="">Todos</mat-option>
      <mat-option *ngFor="let neighborhood of filteredNeighborhoods" [value]="neighborhood.id_neighborhood">
        {{ neighborhood.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Buscar en el mapa</mat-label>
    <input matInput [formGroup]="form" formControlName="search" placeholder="Categoría, barrio, descripción">
  </mat-form-field>

  <div class="mode-actions">
    <button mat-stroked-button type="button" [class.active]="viewMode === 'markers'" (click)="setViewMode('markers')">
      Marcadores
    </button>

    <button mat-stroked-button type="button" [class.active]="viewMode === 'heat'" (click)="setViewMode('heat')">
      Mapa de calor
    </button>
  </div>

  <button mat-stroked-button type="button" (click)="refreshData()">
    Actualizar
  </button>

  <button mat-button type="button" (click)="clear()">
    Limpiar
  </button>
</div>
