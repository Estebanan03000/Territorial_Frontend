<mat-card class="mb-4">
  <mat-card-content>
    <form [formGroup]="form" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Buscar funcionario</mat-label>
        <input matInput formControlName="q" placeholder="Nombre" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Entidad</mat-label>
        <mat-select formControlName="id_entity">
          <mat-option value="">Todas</mat-option>
          <mat-option *ngFor="let entity of entities" [value]="entity.id_entity">
            {{ entity.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Estado</mat-label>
        <mat-select formControlName="status">
          <mat-option value="">Todos</mat-option>
          <mat-option value="activo">Activo</mat-option>
          <mat-option value="inactivo">Inactivo</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="flex gap-2">
        <button mat-flat-button color="primary" type="button" (click)="onSearch()">
          Buscar
        </button>
        <button mat-stroked-button type="button" (click)="onClear()">
          Limpiar
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
